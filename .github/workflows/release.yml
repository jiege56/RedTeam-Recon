name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download tools
        run: |
          mkdir -p tools/goon tools/golin tools/oneforall
          # Download Goon
          Invoke-WebRequest -Uri "https://github.com/i11us0ry/goon/releases/latest/download/goon3_win_amd64.exe" -OutFile "tools/goon/goon3_win_amd64.exe"
          # Download Golin
          Invoke-WebRequest -Uri "https://github.com/selinuxG/Golin/releases/latest/download/golin.exe" -OutFile "tools/golin/golin.exe"
          # Clone OneForAll
          git clone https://github.com/shmilylty/OneForAll.git tools/oneforall-temp
          Copy-Item -Path "tools/oneforall-temp/*.py" -Destination "tools/oneforall/"
          Copy-Item -Path "tools/oneforall-temp/config" -Destination "tools/oneforall/" -Recurse
          Copy-Item -Path "tools/oneforall-temp/common" -Destination "tools/oneforall/" -Recurse
          Copy-Item -Path "tools/oneforall-temp/modules" -Destination "tools/oneforall/" -Recurse
        shell: pwsh

      - name: Create portable package
        run: |
          mkdir dist\RedTeam-Recon-Portable
          xcopy ReconHub dist\RedTeam-Recon-Portable\ReconHub /E /I
          xcopy tools dist\RedTeam-Recon-Portable\tools /E /I
          mkdir dist\RedTeam-Recon-Portable\data\reports
          copy 启动工具.bat dist\RedTeam-Recon-Portable\
          copy README.md dist\RedTeam-Recon-Portable\
          copy requirements.txt dist\RedTeam-Recon-Portable\
        shell: cmd

      - name: Create ZIP
        run: |
          Compress-Archive -Path "dist\RedTeam-Recon-Portable\*" -DestinationPath "dist\RedTeam-Recon-Portable-${{ github.ref_name }}.zip"
        shell: pwsh

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist\RedTeam-Recon-Portable-${{ github.ref_name }}.zip
          generate_release_notes: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
